# 全局 INFO 日志输出到控制台；Mapper 包单独开启 DEBUG 查看 SQL。
log4j.rootLogger=INFO, console

# 控制台输出目标和布局；格式包含时间、级别、日志名称、消息及换行。
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss} [%p] %c - %m%n

# SQL 日志：Preparing 是语句，Parameters 是参数，Updates 是影响行数，Total 是结果数量。
log4j.logger.cn.edu.tjut.huaxin.product.mapper=DEBUG

# 商品缓存模块的 SQL 日志
log4j.logger.cn.edu.tjut.huaxin.product.cache=DEBUG
